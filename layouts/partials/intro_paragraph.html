<section class="personal-poem">
  <pre>I, myself, with my random thoughts,
    walking through the mountain to reach an abandoned wall;
which was a symbol of greatness in ancient times,
    and still is in essence.
There is a tiny hole where I whisper,
then cover it again with grass.
</pre>
</section>

<figure class="literary-quote">
  <blockquote>
    <p>
      In these random impressions, and with no desire to be other than random,
      I indifferently narrate my factless autobiography, my lifeless history.
      <span class="ellipsis"> […] </span>
      If I write what I feel, it’s to reduce the fever of feeling.
    </p>
  </blockquote>

  <figcaption>
    — Fernando Pessoa, <cite>The Book of Disquiet</cite>
  </figcaption>
</figure>
