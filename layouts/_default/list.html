{{ define "main" }}

<h1>.....</h1>

<style>
.timeline {
  border-left: 1px solid var(--border);
  margin: 2rem 0;
  padding-left: 1.5rem;
}

.timeline-item {
  position: relative;
  margin-bottom: 2rem;
}

.timeline-item::before {
  content: "";
  position: absolute;
  left: -1.85rem;
  top: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text);
}

.timeline-item time {
  display: block;
  font-size: .8rem;
  opacity: .55;
  margin-bottom: 4px;
}

.timeline-item > a {
  font-weight: 500;
  text-decoration: none;
}

.post-tags {
  margin-top: 6px;
}

.post-tags a {
  font-size: .72rem;
  opacity: .6;
  margin-right: 8px;
  text-decoration: none;
}
</style>

<div class="timeline">
    {{ range .Pages.ByDate.Reverse }}
    <article class="timeline-item">
        <time>{{ .Date.Format "Jan 02, 2006" }}</time>
        <a class="timeline-title" href="{{ .RelPermalink }}">
            {{ .Title }}
        </a>
        <div class="post-tags">
            {{ range .Params.tags }}
            <a href="{{ "/tags/" | relURL }}{{ . | urlize }}/">
                #{{ . }}
            </a>
            {{ end }}
        </div>
    </article>
    {{ end }}
</div>

{{ end }}
